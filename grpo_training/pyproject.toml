[project]
name = "finance-rag-grpo"
version = "0.1.0"
description = "Isolated Linux GPU dependencies for reviewed GRPO experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
  "trl[vllm]==1.15.0",
  "vllm==0.22.0",
  "torch==2.11.0",
  "transformers>=5.5.1,<5.6",
  "peft>=0.18,<0.19",
  "accelerate==1.12.0",
  "datasets>=4.7,<5",
  "modal==1.6.1",
  "tensorboard==2.20.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
