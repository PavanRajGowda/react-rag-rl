[project]
name = "finance-rag"
version = "0.1.0"
description = "Versioned, unchunked FinQA retrieval API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "elasticsearch>=8.17,<9",
  "datasets>=3,<5", "huggingface-hub>=0.28,<2", "modal>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]
observability = [
    "tensorboard>=2.20,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
