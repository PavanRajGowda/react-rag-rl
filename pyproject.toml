[project]
name = "react-rag-rl"
version = "0.1.0"
description = "ReAct-style RAG agents with GRPO training and local process advantage shaping"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2,<3",
  "filelock>=3,<5",
  "elasticsearch>=8.17,<9",
  "tqdm>=4.67,<5",
  "datasets>=3,<5",
  "huggingface-hub>=0.28,<2",
  "modal>=1,<2",
  "pandas>=2.2,<4",
]

[dependency-groups]
analysis = [
    "numpy>=2,<3",
    "matplotlib>=3.9,<4",
]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
