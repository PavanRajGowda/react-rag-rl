[project]
name = "finance-rag-baseline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.10.0", "transformers==5.3.0", "accelerate==1.12.0",
  "huggingface-hub==1.33.0", "modal==1.6.1",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
